# 웹(HTML5) 빌드를 만들어 GitHub Pages(gh-pages 브랜치)에 올린다.
# 주소: https://seoyeonwoo11.github.io/hexagon/
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip

      - name: Download web export template
        run: |
          python3 tools/fetch_web_template.py \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            web_nothreads_release.zip

      - name: Export
        run: |
          ./godot --headless --path . --import || true
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
